name: Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
      - name: Generate patterns.json from patterns.yaml
        run: deno task patterns:build
      - name: Publish package
        run: deno publish
